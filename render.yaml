services:
  - type: web
    name: gabriel-voice-os
    runtime: docker
    plan: 0.5c-512mb
    repo: https://github.com/socgabrielcardoso/voicesolo
    branch: main
    region: virginia
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: voice-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: ALLOWED_ALEXA_USERS
        value: ""
      - key: OPENAI_TEXT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_VOICE
        value: coral
      - key: DATA_DIR
        value: /app/data
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: DAILY_TURN_LIMIT
        value: "100"
      - key: DAILY_REALTIME_LIMIT
        value: "10"
